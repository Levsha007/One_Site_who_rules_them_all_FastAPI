<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator - Bro Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: hsl(0, 0%, 95%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: hsl(0, 0%, 30%);
            font-size: 3em;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        form {
            background-color: white;
            max-width: 400px;
            width: 90%;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 5px 5px 15px hsl(0, 0%, 30%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        label {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            width: 100%;
            text-align: center;
        }

        input {
            width: 80%;
            text-align: center;
            font-size: 1.8em;
            border: 2px solid hsl(0, 0%, 80%);
            border-radius: 8px;
            padding: 10px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: hsl(120, 100%, 40%);
            outline: none;
        }

        button {
            background-color: hsl(120, 100%, 40%);
            border: none;
            border-radius: 20px 100px 20px 100px;
            color: white;
            font-size: 1.8em;
            margin-top: 20px;
            padding: 15px 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            background-color: hsl(120, 100%, 30%);
            transform: scale(1.05);
        }

        #total {
            font-size: 1.8em;
            margin-top: 20px;
            text-align: center;
        }

        #total-amount {
            color: hsl(120, 100%, 35%);
            font-weight: bold;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            h1 {
                font-size: 2em;
            }
            
            form {
                padding: 20px;
            }
            
            label {
                font-size: 1.2em;
            }
            
            input {
                font-size: 1.5em;
                width: 90%;
            }
            
            button {
                font-size: 1.5em;
                padding: 12px 20px;
            }
            
            #total {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <h1>Interest Calculator</h1>
    <form>
        <label for="principal">Principal Amount: </label>
        <input type="number" id="principal" value="1000">

        <label for="rate">Interest Rate (%): </label>
        <input type="number" id="rate" value="5">

        <label for="years">Years: </label>
        <input type="number" id="years" value="10">

        <button type="button" onclick="calculate()">Calculate</button>

        <p id="total">Total: <span id="total-amount">$1,628.89</span></p>
    </form>

    <script>
        function calculate(){
            const totalAmount = document.getElementById("total-amount");
            const principalInput = document.getElementById("principal");
            const rateInput = document.getElementById("rate");
            const yearsInput = document.getElementById("years");

            let principal = Number(principalInput.value);
            let rate = Number(rateInput.value / 100);
            let years = Number(yearsInput.value);

            if (principal < 0 || isNaN(principal)){
                principal = 0;
                principalInput.value = 0;
            }

            if (rate < 0 || isNaN(rate)){
                rate = 0;
                rateInput.value = 0;
            }

            if (years < 0 || isNaN(years)){
                yearsInput.value = 0;
                years = 0;
            }

            const result = principal * Math.pow((1 + rate / 1), 1 * years);

            totalAmount.textContent = result.toLocaleString(undefined, {
                style: "currency",
                currency: "USD",
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // Автоматический расчет при загрузке
        document.addEventListener('DOMContentLoaded', calculate);
    </script>
</body>
</html>
