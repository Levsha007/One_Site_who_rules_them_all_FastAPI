<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Bro Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: hsl(34, 78%, 98%);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #container {
            max-width: 600px;
            width: 90%;
            margin: 0 auto;
            text-align: center;
            font-size: 1.7rem;
            font-weight: bold;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        #container h1 {
            font-size: 2.5rem;
            margin-bottom: 25px;
            color: #2c3e50;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: normal;
            color: #34495e;
        }

        input[type="number"] {
            font-size: 1.8rem;
            width: 120px;
            text-align: center;
            padding: 10px;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            background-color: white;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
        }

        h4 {
            margin: 25px 0 15px;
            color: #2c3e50;
            font-size: 1.8rem;
        }

        .option {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 18px 0;
            padding: 10px;
            background: rgba(52, 152, 219, 0.05);
            border-radius: 10px;
            transition: background 0.3s ease;
        }

        .option:hover {
            background: rgba(52, 152, 219, 0.1);
        }

        .option input[type="checkbox"] {
            transform: scale(1.4);
            accent-color: hsl(210, 100%, 50%);
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
            user-select: none;
            font-weight: normal;
            font-size: 1.5rem;
            margin: 0;
        }

        button {
            font-size: 1.8rem;
            padding: 15px 30px;
            margin: 30px 0 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        button:hover {
            background: linear-gradient(45deg, #2980b9, #3498db);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #PasswordResult {
            margin-top: 25px;
            font-size: 1.4rem;
            line-height: 1.6;
            word-break: break-all;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .copy-btn {
            font-size: 1rem;
            padding: 8px 15px;
            margin-top: 10px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            #container {
                font-size: 1.4rem;
                padding: 20px;
            }
            
            #container h1 {
                font-size: 2rem;
            }
            
            input[type="number"] {
                font-size: 1.5rem;
                width: 100px;
            }
            
            .option label {
                font-size: 1.3rem;
            }
            
            button {
                font-size: 1.5rem;
                padding: 12px 25px;
            }
            
            #PasswordResult {
                font-size: 1.2rem;
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            #container {
                font-size: 1.2rem;
                padding: 15px;
            }
            
            .option {
                gap: 10px;
                margin: 15px 0;
            }
            
            .option label {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Random Password Generator</h1>

        <label for="PasswordLength">Length of password: </label>
        <input type="number" id="PasswordLength" value="20" min="1" max="100">

        <h4>Characters included in the password</h4>

        <div class="option">
            <input type="checkbox" id="includeLowercaseButton" checked>
            <label for="includeLowercaseButton">Lowercase (a-z)</label>
        </div>

        <div class="option">
            <input type="checkbox" id="includeUppercaseButton" checked>
            <label for="includeUppercaseButton">Uppercase (A-Z)</label>
        </div>

        <div class="option">
            <input type="checkbox" id="includeNumbersButton" checked>
            <label for="includeNumbersButton">Numbers (0-9)</label>
        </div>

        <div class="option">
            <input type="checkbox" id="includeSymbolsButton" checked>
            <label for="includeSymbolsButton">Symbols (!@#$...)</label>
        </div>

        <button onclick="generatePassword()">Generate Password</button>

        <div id="PasswordResult">Generated password will appear here</div>
    </div>

    <script>
        function generatePassword() {
            // Получаем длину пароля
            const passwordLengthInput = document.getElementById('PasswordLength');
            const length = parseInt(passwordLengthInput.value);

            // Проверяем длину
            if (isNaN(length) || length <= 0) {
                document.getElementById("PasswordResult").textContent = "❌ Password length must be at least 1.";
                return;
            }

            // Получаем состояние чекбоксов
            const includeLowercase = document.getElementById('includeLowercaseButton').checked;
            const includeUppercase = document.getElementById('includeUppercaseButton').checked;
            const includeNumbers = document.getElementById('includeNumbersButton').checked;
            const includeSymbols = document.getElementById('includeSymbolsButton').checked;

            // Генерация наборов символов
            let lowercaseChars = '';
            let uppercaseChars = '';

            for (let i = 97; i <= 122; i++) { // a-z
                lowercaseChars += String.fromCharCode(i);
            }
            for (let i = 65; i <= 90; i++) { // A-Z
                uppercaseChars += String.fromCharCode(i);
            }

            const numberChars = '0123456789';
            const symbolChars = '!@#$%^&*()_+=-[]{};\':",.<>?/';

            // Формируем разрешённые символы
            let allowedChars = '';
            if (includeLowercase) allowedChars += lowercaseChars;
            if (includeUppercase) allowedChars += uppercaseChars;
            if (includeNumbers) allowedChars += numberChars;
            if (includeSymbols) allowedChars += symbolChars;

            // Проверка: выбран хотя бы один тип символов
            if (allowedChars === '') {
                document.getElementById("PasswordResult").textContent = "❌ At least one character set must be selected.";
                return;
            }

            // Генерация пароля
            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * allowedChars.length);
                password += allowedChars[randomIndex];
            }

            // Вывод результата с кнопкой копирования
            document.getElementById("PasswordResult").innerHTML = 
                `<strong>Generated password:</strong><br>${password}
                 <br><button class="copy-btn" onclick="copyToClipboard('${password}')">📋 Copy</button>`;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Password copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // Автоматическая генерация при загрузке
        document.addEventListener('DOMContentLoaded', generatePassword);
    </script>
</body>
</html>
