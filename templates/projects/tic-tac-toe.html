<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Bro Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Permanent Marker", cursive;
        }
        
        #gameContainer{
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 90%;
        }
        
        h1 {
            color: #333;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        #cellContainer{
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 6px;
            margin: 20px auto;
            background: #333;
            padding: 6px;
            border-radius: 10px;
            width: 318px;
        }
        
        .cell{
            width: 100px;
            height: 100px;
            border: 3px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            line-height: 100px;
            font-size: 60px;
            cursor: pointer;
            background: #f8f9fa;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cell:hover {
            background: #e9ecef;
            transform: scale(1.05);
        }
        
        #statusText {
            font-size: 2em;
            margin: 20px 0;
            color: #333;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #restartBtn {
            background: #764ba2;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: "Permanent Marker", cursive;
        }
        
        #restartBtn:hover {
            background: #667eea;
            transform: scale(1.1);
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            #gameContainer {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            #cellContainer {
                grid-template-columns: repeat(3, 80px);
                grid-template-rows: repeat(3, 80px);
                width: 258px;
            }
            
            .cell {
                width: 80px;
                height: 80px;
                font-size: 40px;
                line-height: 80px;
            }
            
            #statusText {
                font-size: 1.5em;
            }
            
            #restartBtn {
                padding: 12px 24px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>Tic Tac Toe</h1>
        <div id="cellContainer">
            <div cellIndex="0" class="cell"></div>
            <div cellIndex="1" class="cell"></div>
            <div cellIndex="2" class="cell"></div>
            <div cellIndex="3" class="cell"></div>
            <div cellIndex="4" class="cell"></div>
            <div cellIndex="5" class="cell"></div>
            <div cellIndex="6" class="cell"></div>
            <div cellIndex="7" class="cell"></div>
            <div cellIndex="8" class="cell"></div>
        </div>
        <h2 id="statusText">X's turn</h2>
        <button id="restartBtn">Restart</button>
    </div>
    
    <script>
        const cells = document.querySelectorAll(".cell");
        const statusText = document.querySelector("#statusText");
        const restartBtn = document.querySelector("#restartBtn");
        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];
        let options = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let running = false;

        initializeGame();

        function initializeGame(){
            cells.forEach(cell => cell.addEventListener("click", cellClicked));
            restartBtn.addEventListener("click", restartGame);
            statusText.textContent = `${currentPlayer}'s turn`;
            running = true;
        }

        function cellClicked(){
            const cellIndex = this.getAttribute("cellIndex");
            if(options[cellIndex] != "" || !running) return;
            updateCell(this, cellIndex);
            checkWinner();
        }

        function updateCell(cell, index){
            options[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.style.color = currentPlayer === "X" ? "#667eea" : "#764ba2";
        }

        function changePlayer(){
            currentPlayer = (currentPlayer == "X") ? "O" : "X";
            statusText.textContent = `${currentPlayer}'s turn`;
        }

        function checkWinner(){
            let roundWon = false;
            for(let i = 0; i < winConditions.length; i++){
                const condition = winConditions[i];
                const cellA = options[condition[0]];
                const cellB = options[condition[1]];
                const cellC = options[condition[2]];

                if(cellA == "" || cellB == "" || cellC == "") continue;
                if(cellA == cellB && cellB == cellC){
                    roundWon = true;
                    highlightWinningCells(condition);
                    break;
                }
            }

            if(roundWon){
                statusText.textContent = `${currentPlayer} wins!`;
                statusText.style.color = currentPlayer === "X" ? "#667eea" : "#764ba2";
                running = false;
            }
            else if(!options.includes("")){
                statusText.textContent = `Draw!`;
                statusText.style.color = "#333";
                running = false;
            }
            else{
                changePlayer();
            }
        }

        function highlightWinningCells(condition){
            condition.forEach(index => {
                cells[index].style.background = "linear-gradient(45deg, #ffd89b, #19547b)";
                cells[index].style.color = "white";
            });
        }

        function restartGame(){
            currentPlayer = "X";
            options = ["", "", "", "", "", "", "", "", ""];
            statusText.textContent = `${currentPlayer}'s turn`;
            statusText.style.color = "#333";
            cells.forEach(cell => {
                cell.textContent = "";
                cell.style.background = "#f8f9fa";
                cell.style.color = "#333";
            });
            running = true;
        }
    </script>
</body>
</html>
